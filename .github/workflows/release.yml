# On pushes to master (merged PRs): test, then compute the next version from the conventional
# commits, make a release commit off master that writes it into package.xml, tag that commit
# vX.Y.Z and publish a GitHub release (DESIGN.md, Development process).
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version
        id: next
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          default_bump: false
          release_branches: ^master$

      - name: Release commit
        id: commit
        if: steps.next.outputs.new_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.new_version }}
        run: |
          sed -i -E \
            -e "s|<version>[^<]*</version>|<version>${VERSION}</version>|" \
            -e "s|<date>[^<]*</date>|<date>$(date -u +%F)</date>|" package.xml
          # A commit on top of the released master commit, on no branch: only the tag points
          # at it, so protected master is untouched. The git-data API commits as the
          # workflow's own identity.
          repo="repos/${GITHUB_REPOSITORY}"
          base_tree="$(gh api "$repo/git/commits/${GITHUB_SHA}" --jq .tree.sha)"
          blob="$(jq -n --arg c "$(base64 -w0 package.xml)" '{content: $c, encoding: "base64"}' \
            | gh api "$repo/git/blobs" --input - --jq .sha)"
          tree="$(jq -n --arg b "$base_tree" --arg s "$blob" \
            '{base_tree: $b, tree: [{path: "package.xml", mode: "100644", type: "blob", sha: $s}]}' \
            | gh api "$repo/git/trees" --input - --jq .sha)"
          sha="$(jq -n --arg m "chore(release): v${VERSION}" --arg t "$tree" --arg p "$GITHUB_SHA" \
            '{message: $m, tree: $t, parents: [$p]}' \
            | gh api "$repo/git/commits" --input - --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.next.outputs.new_version != ''
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.next.outputs.new_version }}
          commit_sha: ${{ steps.commit.outputs.sha }}

      - name: GitHub release
        if: steps.next.outputs.new_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next.outputs.new_tag }}
          NOTES: ${{ steps.next.outputs.changelog }}
        run: gh release create "$TAG" --title "$TAG" --notes "$NOTES" --verify-tag
