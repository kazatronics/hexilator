# Hexilator toolchain. All tool versions are pinned here.
#
# Not in mise: FreeCAD (a system package locally; the official AppImage in CI, fetched by
# `mise run fetch-freecad`). The addon and its tests run under the Python that FreeCAD is
# built for. FREECADCMD and FREECAD override the binaries the tasks use.
#
# Tasks are file tasks in mise-tasks/, never inline [tasks] here.

[tools]
actionlint = "1.7.12"
shellcheck = "0.11.0"
